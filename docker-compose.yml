services:
  backend:
    build: ./backend
    env_file: .env
    environment:
      FG_DB: /data/faceguard.db
    volumes:
      - ./data:/data
      - ./backend/models:/srv/models
      - ./backend/model_project:/srv/model_project
    ports: ["8000:8000"]          # API plus the website, for development
  candidate-site:                  # candidates open http://localhost:8081
    image: nginx:alpine
    volumes:
      - ./frontend:/usr/share/nginx/html:ro
      - ./deploy/nginx-candidate.conf:/etc/nginx/conf.d/default.conf:ro
    ports: ["8081:80"]
    depends_on: [backend]
  admin-site:                      # staff open http://localhost:8082 (redirects to the sign-in page)
    image: nginx:alpine
    volumes:
      - ./frontend:/usr/share/nginx/html:ro
      - ./deploy/nginx-admin.conf:/etc/nginx/conf.d/default.conf:ro
    ports: ["8082:80"]
    depends_on: [backend]
